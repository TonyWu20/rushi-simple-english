# The `simple-english-ext` TUI status widget. Standalone cargo package
# (not a member of the root workspace).

[package]
name = "simple-english-ext"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "simple-english-ext"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
