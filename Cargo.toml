# The `tool.before` + `model.before` writing-rule hook.
#
# Ported from jyooi/agent-simple-english (the Claude Code plugin and
# pi extension) to the rushi harness hook ABI.
#
# Windows:
#   - tool.before:  gates write, edit, and bash (git commit) calls
#   - model.before: injects the writing-rule summary into the prompt
#
# Build: `cargo build` in this directory. The binary lands in
# ./target/debug/harness-hook-simple-english. The loop resolves the
# bare name from config.toml [hooks] on PATH.

[package]
name = "hook-simple-english"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "harness-hook-simple-english"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
regex = "1"
similar = "3.2.0"
split-paragraphs = "1.0.0"
fnv = "1.0.7"
shlex = "2.0.1"

[dev-dependencies]
tempfile = "3"
